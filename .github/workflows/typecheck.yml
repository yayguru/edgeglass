name: typecheck

on:
  push:
  pull_request:

jobs:
  tsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm --workspace app exec tsc --noEmit
      - run: npm --workspace worker exec tsc --noEmit
